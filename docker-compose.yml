services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: accel
      POSTGRES_PASSWORD: accel
      POSTGRES_DB: accel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accel -d accel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./backend/uploads:/app/uploads
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql+psycopg2://accel:accel@postgres:5432/accel
      - DEMO_TODAY=2026-07-15
      - DATA_DIR=/data
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=dev-only-change-me-in-production
      - APP_ENCRYPTION_KEY=dev-only-change-me-in-production
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - LLM_PROVIDER=offline
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host

volumes:
  postgres_data:
